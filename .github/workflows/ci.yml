name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm verify

  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - run: docker build -f Dockerfile.sandbox -t codevil-sandbox:ci .

      - run: node packages/sandbox-image/test/sandbox-image-smoke.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - sandbox-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CODEVIL_WEB_ORIGIN: ${{ vars.CODEVIL_WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate production Wrangler config
        run: pnpm --filter @codevil/worker exec node scripts/write-deployment-config.mjs

      - name: Check for pending D1 migrations
        run: pnpm --filter @codevil/worker run check:migrations
        env:
          CODEVIL_WRANGLER_CONFIG: .wrangler.deploy.toml

      - name: Deploy to Cloudflare
        run: |
          pnpm --filter @codevil/shared run build
          pnpm --filter @codevil/web run build
          pnpm --filter @codevil/worker exec wrangler deploy --config .wrangler.deploy.toml
