name = "codevil"
main = "src/index.ts"
compatibility_date = "2026-04-07"
workers_dev = true

[vars]
CODEVIL_PREVIEW_ORIGIN = "https://lexmora.app"

[[routes]]
pattern = "*.lexmora.app/*"
zone_name = "lexmora.app"

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[[containers]]
class_name = "Sandbox"
image = "../../Dockerfile.sandbox"
instance_type = "standard-1"
max_instances = 5

  [containers.wrangler_ssh]
  enabled = true

  [[containers.authorized_keys]]
  name = "skrishnan"
  public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFtkKouaIC/eYvfkC//kSCqiim8C6301kF+Fhp7V1nrm skrish22195@gmail.com"

[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "Orchestrator"

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[d1_databases]]
binding = "DB"
database_name = "codevil"
database_id = "f497dece-7db6-441d-8eaf-cc57e02fb56a"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Orchestrator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]
