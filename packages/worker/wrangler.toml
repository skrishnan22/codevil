name = "codevil"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
upload_source_maps = true

[vars]
EMAIL_PROVIDER = "none"
CODEVIL_WEB_ORIGIN = "https://codevil-ui.pages.dev,http://localhost:5173,http://localhost:8787"
# Preview subdomains: {token}.lexmora.app → worker (Next.js/Vite use root-absolute asset paths).
CODEVIL_PREVIEW_ORIGIN = "https://lexmora.app"
BACKUP_BUCKET_NAME = "codevil-sandbox-backups"

[[routes]]
pattern = "*.lexmora.app/*"
zone_name = "lexmora.app"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[[containers]]
class_name = "Sandbox"
image = "../../Dockerfile.sandbox"
instance_type = "standard-1"
max_instances = 5

[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "Orchestrator"

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "codevil-sandbox-backups"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Orchestrator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]
