name = "codevil"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
upload_source_maps = true

[vars]
EMAIL_PROVIDER = "none"
# New sessions run on E2B. This needs E2B_API_KEY as a Worker secret and as a
# GitHub Actions secret in the production environment; the CI deploy publishes
# this commit's template and pins E2B_TEMPLATE_ID to "<id>:<commit sha>".
# Set "cloudflare" to roll back: new sessions return to Cloudflare containers,
# and existing sessions keep the provider they started on.
# (Code default with no var at all is "e2b"; deploys require this to be explicit.)
SANDBOX_PROVIDER = "e2b"
E2B_TEMPLATE_ID = "codevil-sandbox"
CODEVIL_WEB_ORIGIN = "http://localhost:5173,http://localhost:8787"
# Leaving CODEVIL_PREVIEW_ORIGIN unset keeps preview URLs on the portable
# workers.dev path. Set it in an untracked operator overlay to use a domain.
BACKUP_BUCKET_NAME = "codevil-sandbox-backups"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[[containers]]
class_name = "Sandbox"
image = "../../Dockerfile.sandbox"
instance_type = "standard-3"
max_instances = 5

  [containers.ssh]
  enabled = false

[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "Orchestrator"

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[d1_databases]]
binding = "DB"
database_name = "codevil"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "codevil-sandbox-backups"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Orchestrator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]
